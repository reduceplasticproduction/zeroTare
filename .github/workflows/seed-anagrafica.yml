name: Seed anagrafica (Open Food Facts / Open Prices)

# Si lancia A MANO dal tab "Actions" di GitHub (pulsante "Run workflow"): non gira
# automaticamente, non tocca nulla finché non lo premi tu. Fa TUTTO il lavoro che
# altrimenti richiederebbe DuckDB installato e comandi da Terminale sul Mac — gira su
# un runner GitHub con internet pieno, estrae i due CSV dai dump ufficiali Open Food
# Facts/Open Prices (scripts/seed_estrai.sql) e li carica direttamente su Supabase
# (scripts/seed_carica.mjs). Zero chiamate a Claude, zero vendor a pagamento.
#
# Prima di usarlo UNA VOLTA SOLA: Settings → Secrets and variables → Actions →
# "New repository secret", aggiungi questi due (stessi valori già su Vercel):
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installa DuckDB (binario ufficiale, gratis)
        run: |
          curl -L https://github.com/duckdb/duckdb/releases/latest/download/duckdb_cli-linux-amd64.zip -o duckdb.zip
          unzip duckdb.zip
          chmod +x duckdb
          sudo mv duckdb /usr/local/bin/duckdb

      # v2 (2026-08-11): scarichiamo i dump UNA VOLTA SOLA in locale invece di farli
      # interrogare da DuckDB via httpfs a distanza — la query remota sul Parquet di
      # Hugging Face generava centinaia di piccole richieste ed esauriva il limite
      # anonimo di HF (condiviso tra tutti i runner GitHub Actions, non solo i nostri).
      # Il CSV prodotti viene da static.openfoodfacts.org (host diverso da Hugging
      # Face: il 429 non c'entra più); il Parquet Open Prices resta su Hugging Face ma
      # ora scaricato per intero anziché interrogato, stessa precauzione.
      - name: Scarica i dump ufficiali (un download intero, non query remota)
        working-directory: scripts
        run: |
          curl -L --fail --retry 3 --retry-delay 10 \
            -o food.csv.gz \
            https://static.openfoodfacts.org/data/en.openfoodfacts.org.products.csv.gz
          ls -lh food.csv.gz
          curl -L --fail --retry 3 --retry-delay 10 \
            -o open_prices.parquet \
            https://huggingface.co/datasets/openfoodfacts/open-prices/resolve/main/prices.parquet
          ls -lh open_prices.parquet

      - name: Estrai i CSV dai dump scaricati (DuckDB, tutto in locale)
        working-directory: scripts
        run: duckdb -c ".read seed_estrai.sql"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Carica anagrafica + prezzi reali su Supabase
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node seed_carica.mjs

      - name: Conserva i CSV come allegato (per controllo/debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seed-csv
          path: scripts/*.csv
          if-no-files-found: ignore
